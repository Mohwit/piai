[project]
name = "piai"
version = "0.1.0"
description = "Unified LLM abstraction for Python — port of @earendil-works/pi-ai"
requires-python = ">=3.10"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
vertex = [
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.0.0",
]
google = [
    "google-generativeai>=0.8.0",
]
mistral = ["mistralai>=1.0.0"]
bedrock = ["boto3>=1.34.0"]
all = ["piai[vertex,google,mistral,bedrock]"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
